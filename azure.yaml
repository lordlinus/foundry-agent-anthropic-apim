# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: foundry-agent-anthropic-apim
services:
  # No model deployment: the agent talks to an Anthropic (Claude) model through
  # an API Management gateway, not a Foundry-deployed model. The project is
  # still required for hosting, identity, and session/conversation management.
  ai-project:
    host: azure.ai.project
  anthropic-agent-basic:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Anthropic
        - APIM
        - Streaming
    project: src/anthropic-agent-basic
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: anthropic-agent-basic
    description: An Agent Framework agent that calls an Anthropic (Claude) model through an APIM gateway, hosted by Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      ANTHROPIC_MODEL_NAME: ${ANTHROPIC_MODEL_NAME=claude-sonnet-5}
      APIM_ANTHROPIC_BASE_URL: ${APIM_ANTHROPIC_BASE_URL}
      APIM_SUBSCRIPTION_KEY: ${APIM_SUBSCRIPTION_KEY}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  anthropic-agent-healthcare:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Anthropic
        - APIM
        - Healthcare
        - MCP
        - Skills
    project: src/anthropic-agent-healthcare
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: anthropic-agent-healthcare
    description: Healthcare Agent featuring Anthropic Claude via APIM with Toolbox, Healthcare Skills, and MCP tools (NPI, PubMed, ICD-10, CMS Coverage, Clinical Trials).
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      ANTHROPIC_MODEL_NAME: ${ANTHROPIC_MODEL_NAME=claude-sonnet-5}
      APIM_ANTHROPIC_BASE_URL: ${APIM_ANTHROPIC_BASE_URL}
      APIM_SUBSCRIPTION_KEY: ${APIM_SUBSCRIPTION_KEY}
      FOUNDRY_TOOLBOX_ENDPOINT: ${FOUNDRY_TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  anthropic-agent-underwriting:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Anthropic
        - APIM
        - Multi-Model
        - Underwriting
        - Judge
        - Toolbox
    project: src/anthropic-agent-underwriting
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: anthropic-agent-underwriting
    description: Multi-model Commercial & Personal Underwriting Agent combining Haiku/Sonnet for initial tool processing with Opus for Executive Judge verdict & summary.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      ANTHROPIC_MODEL_NAME: ${ANTHROPIC_MODEL_NAME=claude-sonnet-5}
      ANTHROPIC_FAST_MODEL_NAME: ${ANTHROPIC_FAST_MODEL_NAME=claude-haiku-4.5}
      ANTHROPIC_OPUS_MODEL_NAME: ${ANTHROPIC_OPUS_MODEL_NAME=claude-opus-4.7}
      APIM_ANTHROPIC_BASE_URL: ${APIM_ANTHROPIC_BASE_URL}
      APIM_SUBSCRIPTION_KEY: ${APIM_SUBSCRIPTION_KEY}
      FOUNDRY_TOOLBOX_ENDPOINT: ${FOUNDRY_TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postprovision:
    posix:
      shell: sh
      run: src/anthropic-agent-basic/hooks/postprovision.sh
      interactive: true
infra:
  provider: microsoft.foundry
